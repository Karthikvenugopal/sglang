name: External MLA validation

on:
  push:
    branches: [validation/external-model-mla]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pre-commit
      - name: Pinned pre-commit checks for changed files
        run: >-
          pre-commit run --show-diff-on-failure --files
          python/sglang/srt/configs/model_config.py
          test/registered/unit/configs/test_model_config_shapes.py
          docs/docs/supported-models/support_new_models.mdx
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --prefix /tmp/mint mint@4.2.559
      - name: Documentation links and anchors
        working-directory: docs
        run: /tmp/mint/node_modules/.bin/mint broken-links --check-anchors --check-redirects

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SGLANG_IS_IN_CI: 'true'
      UV_SYSTEM_PYTHON: '1'
      PYTHONPATH: ${{ github.workspace }}/python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Free build disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
      - name: Install Rust and protoc prerequisites
        run: bash scripts/ci/utils/install_rust_protoc.sh
      - name: Install official CPU-test dependencies
        run: uv pip install -e 'python[dev]' --index-strategy unsafe-best-match --prerelease allow
      - name: Registered configuration tests
        run: |
          python3 test/registered/unit/configs/test_model_config_shapes.py
          python3 test/registered/unit/configs/test_model_config_scaling.py
          python3 test/registered/unit/configs/test_model_config.py
      - name: Regression against original model configuration
        run: |
          cp python/sglang/srt/configs/model_config.py /tmp/modified-model-config.py
          git show 542a7325f0933b5b9d2ebad5ad23f580db63cb83:python/sglang/srt/configs/model_config.py > python/sglang/srt/configs/model_config.py
          if python3 test/registered/unit/configs/test_model_config_shapes.py TestModelConfigShapes.test_external_model_opts_into_mla; then
            echo 'Regression unexpectedly passed on the original implementation'
            exit 1
          fi
          cp /tmp/modified-model-config.py python/sglang/srt/configs/model_config.py
